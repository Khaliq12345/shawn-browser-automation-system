version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.simple
    env_file:
      - .env
    command: uv run main.py
    ports:
      - "${APP_PORT}:${APP_PORT}"
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT}:3000"
    command: node ./interface/.output/server/index.mjs
    depends_on:
      - api
    restart: always

  monitor:
    build:
      context: .
      dockerfile: Dockerfile.simple
    env_file:
      - .env
    command: uv run celery -A src.utils.celery_app flower
    ports:
      - "${FLOWER_PORT}:${FLOWER_PORT}"
    restart: always

  beat:
    build:
      context: .
      dockerfile: Dockerfile.simple
    env_file:
      - .env
    command: uv run celery -A src.utils.celery_app beat -l INFO
    restart: always

  trigger_worker:
    build:
      context: .
      dockerfile: Dockerfile.simple
    env_file:
      - .env
    command: uv run celery -A src.utils.celery_app worker -c 1 -Q beat_triggers -n trigger_worker@%h -l INFO
    restart: always

  worker_new_jobs:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: uv run celery -A src.utils.celery_app worker -c 1 -Q new_jobs -n server1_new@%h -l INFO
    restart: always

  worker_scheduled_jobs:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: uv run celery -A src.utils.celery_app worker -c 1 -Q scheduled_jobs -n server2_scheduled@%h -l INFO
    restart: always
